name: Project Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # cudaq requires an NVIDIA Linux GPU host (or the project's Docker
      # image) and is not installable on standard GitHub-hosted runners, so
      # CI installs only the portable subset of requirements.txt. This
      # covers tests/test_quantum_engine.py, which exercises
      # ClinicalFitnessEngine (pure NumPy) rather than the CUDA-Q kernel.
      - name: Install portable dependencies
        run: pip install numpy pytest pydantic

      - name: Run test suite
        run: PYTHONPATH=src python -m pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
